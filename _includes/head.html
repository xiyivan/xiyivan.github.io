<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  <link rel="stylesheet" href="{{ '/assets/css/background.css' | relative_url }}">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- add support to latex files using command katex: true -->
   {% if page.katex %}

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>

  <!-- JavaScript -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@latest/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{
      delimiters: [
        { left: '$$',  right: '$$',  display: true  },
        { left: '$',   right: '$',   display: false },
        { left: '\\[', right: '\\]', display: true  },
        { left: '\\(', right: '\\)', display: false }
    ]});">
  </script>

  {% endif %}

  <!-- Random background image selection -->
  <script>
    (function() {
      var bgDir = '{{ '/assets/image/background/' | relative_url }}';
      var images = [
        'wallhaven-1kg8eg.jpg',
        'wallhaven-d85kjl.jpg',
        'wallhaven-dp39e3.jpg',
        'wallhaven-exdewo.jpg',
        'wallhaven-g71rd3.jpg',
        'wallhaven-k87x31.jpg',
        'wallhaven-nmpem9.jpg',
        'wallhaven-rrleeq.jpg',
        'wallhaven-x16yvo.jpg',
        'wallhaven-y8k19d.jpg',
        'wallhaven-y8k1k7.jpg',
        'wallhaven-zp85do.png'
      ];
      var pick = images[Math.floor(Math.random() * images.length)];
      document.documentElement.style.setProperty(
        '--bg-image',
        'url(' + bgDir + pick + ')'
      );
    })();
  </script>
</head>
